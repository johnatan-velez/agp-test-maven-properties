# Sonatype Guide — Agentic Patches (AGP) Workflow
# Learn more: https://guide.sonatype.com
# File: .github/workflows/agp_workflow.yml

name: "Sonatype Guide - Agentic Patches"

on:
  schedule:
    # Runs weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

  workflow_dispatch:
    inputs:
      mode:
        description: >
          AGP run mode: "full" scans all dependencies,
          "vulnerabilities" targets only known CVEs.
        type: string
        default: 'full'
      vulnerabilities:
        description: >
          Comma-separated list of CVE IDs to fix
          (only used when mode is "vulnerabilities").
        type: string
        required: false
      verbose:
        description: 'Enable verbose logging for debugging'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # id-token: write  # Required only for AWS Bedrock OIDC authentication

concurrency:
  group: agp-workflow
  cancel-in-progress: false

jobs:
  agp:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      # ── 1. Checkout repository ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS OIDC credentials (Bedrock only) ─────────
      # Uncomment if you switch to AWS Bedrock as AI provider.
      # Requires an OIDC trust relationship configured in AWS.
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      #     aws-region: us-east-1

      # ── 3. Private registry authentication ─────────────
      # No private Maven registry detected in this repository.
      # Uncomment and configure if you add a private registry later.
      #
      # Option A: Maven settings.xml from secret
      # - name: Configure Maven private registry
      #   run: |
      #     mkdir -p ~/.m2
      #     echo "${{ secrets.MAVEN_SETTINGS_XML }}" > ~/.m2/settings.xml
      #
      # Option B: npm projects (.npmrc from secret)
      # - name: Configure npm private registry
      #   run: echo "${{ secrets.NPMRC_CONTENT }}" > .npmrc
      #
      # Option C: Python projects (pip index-url)
      # - name: Configure pip private registry
      #   run: |
      #     pip config set global.index-url "${{ secrets.PIP_INDEX_URL }}"

      # ── 4. Run AGP ─────────────────────────────────────
      - name: Run Sonatype Guide - Agentic Patches
        uses: sonatype/agp-action@v1
        with:
          mode: ${{ inputs.mode || 'full' }}
          vulnerabilities: ${{ inputs.vulnerabilities }}
          create-pr: 'true'
          dry-run: 'false'
          verbose: ${{ inputs.verbose || 'false' }}
          docker-registry: sonatype.repo.sonatype.app/docker-all
          docker-username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker-password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

          # Maven settings.xml — pass as an inline string or from a secret.
          # Uncomment if this project needs private Maven repository access.
          # maven-settings-xml: |
          #   <settings>
          #     <servers>
          #       <server>
          #         <id>private-repo</id>
          #         <username>${{ secrets.MAVEN_REPO_USERNAME }}</username>
          #         <password>${{ secrets.MAVEN_REPO_PASSWORD }}</password>
          #       </server>
          #     </servers>
          #     <profiles>
          #       <profile>
          #         <id>private-repo</id>
          #         <repositories>
          #           <repository>
          #             <id>private-repo</id>
          #             <url>https://your-registry.example.com/repository/maven-public/</url>
          #           </repository>
          #         </repositories>
          #       </profile>
          #     </profiles>
          #     <activeProfiles>
          #       <activeProfile>private-repo</activeProfile>
          #     </activeProfiles>
          #   </settings>

          # npm — uncomment if you add npm/yarn/pnpm projects with a private registry
          # npmrc-content: ${{ secrets.NPMRC_CONTENT }}

          # Python — uncomment if you add Python projects with a private PyPI
          # pip-index-url: ${{ secrets.PIP_INDEX_URL }}
          # pip-extra-index-url: ${{ secrets.PIP_EXTRA_INDEX_URL }}

        # ── 5. Environment variables ────────────────────
        env:
          # Anthropic API key for the AI agent
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # If using AWS Bedrock instead, comment out ANTHROPIC_API_KEY above
          # and uncomment the AWS OIDC step (step 2).

          # Guide dashboard tracking token
          AGP_API_TOKEN: ${{ secrets.AGP_API_TOKEN }}
          AGP_API_URL: https://api.guide-dev.sonatype.dev

          # GitHub token for creating pull requests
          GITHUB_TOKEN: ${{ github.token }}
          # If your org restricts the default token, use a PAT instead:
          # GITHUB_TOKEN: ${{ secrets.AGP_GITHUB_TOKEN }}
